<title>Playground Duty Swaps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one 880px column under a sticky header and tab bar. Days read as ruled lists; hi-vis yellow marks your own duties, like a duty vest. */
:root{
  --bg:#F1F4F3; --surface:#FFFFFF; --sunk:#E6ECEA; --ink:#15212A; --muted:#55646C; --line:#D5DDDA;
  --accent:#1A5871; --accent-ink:#FFFFFF; --accent-soft:#DCEAF0;
  --vis:#F2E33B; --vis-deep:#E3D22A; --on-vis:#15212A; --tape:#C3CCD0;
  --ok:#1C6F45; --ok-bg:#E1F1E8; --warn:#8A4F00; --warn-bg:#FAEED6; --bad:#A8281F; --bad-bg:#FAE3E0; --info:#1A5871; --info-bg:#E2EDF2;
  --scrim:rgba(10,18,22,.5);
  --shadow:0 1px 2px rgba(21,33,42,.06),0 10px 30px rgba(21,33,42,.12);
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --radius:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1316; --surface:#151F25; --sunk:#1C2830; --ink:#E4EBED; --muted:#98A6AD; --line:#2A3840;
  --accent:#7BBFD8; --accent-ink:#0D1316; --accent-soft:#17303C;
  --vis:#E6D838; --vis-deep:#D3C52C; --on-vis:#15212A; --tape:#B7C0C4;
  --ok:#6BC995; --ok-bg:#15301F; --warn:#E8AD58; --warn-bg:#332610; --bad:#F09189; --bad-bg:#3A1917; --info:#7BBFD8; --info-bg:#152A36;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1316; --surface:#151F25; --sunk:#1C2830; --ink:#E4EBED; --muted:#98A6AD; --line:#2A3840;
  --accent:#7BBFD8; --accent-ink:#0D1316; --accent-soft:#17303C;
  --vis:#E6D838; --vis-deep:#D3C52C; --on-vis:#15212A; --tape:#B7C0C4;
  --ok:#6BC995; --ok-bg:#15301F; --warn:#E8AD58; --warn-bg:#332610; --bad:#F09189; --bad-bg:#3A1917; --info:#7BBFD8; --info-bg:#152A36;
  --scrim:rgba(0,0,0,.6);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html.lock{overflow:hidden}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
.wrap{max-width:880px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}
.strong{font-weight:700}
.sm{font-size:13px}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top::before{content:"";display:block;height:7px;background:linear-gradient(var(--vis) 0 2px,var(--tape) 2px 5px,var(--vis) 5px 7px)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding-block:12px 6px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.vest{width:30px;height:30px;border-radius:7px;background:var(--vis);position:relative;flex:none}
.vest::before,.vest::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--tape)}
.vest::before{top:9px}.vest::after{top:17px}
h1.name{font:800 17px/1.1 var(--f-display);font-stretch:78%;letter-spacing:.04em;text-transform:uppercase;margin:0}
.school{margin:2px 0 0;color:var(--muted);font-size:13px}
.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who select{max-width:60vw;min-height:36px;padding:5px 8px}
.tabs{overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabrow{display:flex;gap:0}
.tab{display:inline-flex;align-items:center;gap:6px;padding:10px 7px 9px;color:var(--muted);text-decoration:none;font:650 14px/1.2 var(--f-display);font-stretch:84%;border-bottom:3px solid transparent;white-space:nowrap}
.tab:first-child{padding-left:0}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--accent)}
.badge{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--vis);color:var(--on-vis);font:700 12px/20px var(--f-body);text-align:center}

/* Main */
main{padding-block:22px 36px;display:flex;flex-direction:column;gap:30px}
.sec{display:flex;flex-direction:column;gap:12px;min-width:0}
.sec>h2{font:700 21px/1.2 var(--f-display);font-stretch:86%;margin:0;text-wrap:balance}
.intro{margin:-6px 0 0;color:var(--muted);max-width:65ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.banner{padding:10px 14px;border-radius:8px;font-size:14px;margin:0}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--info)}
.loading{padding:40px 0;color:var(--muted);text-align:center}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:22px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.empty h2{font:700 20px/1.2 var(--f-display);font-stretch:86%;margin:0}
.empty p{margin:0;max-width:60ch;color:var(--muted)}

/* Days and duties */
.days{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.day{padding:12px 14px;border-top:1px solid var(--line)}
.day:first-child{border-top:0}
.day-h{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px}
.day-d{font:650 15px/1.3 var(--f-display);font-stretch:92%;margin:0 auto 0 0}
.day.quiet{padding-block:9px}
.day.quiet .day-d{color:var(--muted);font-weight:500}
.duty{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:6px 12px;margin-top:10px}
.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding:4px 8px;border-radius:6px;background:var(--sunk);white-space:nowrap}
.time.vis{background:var(--vis);color:var(--on-vis)}
.duty-main{min-width:0}
.duty-s{font-size:13px;color:var(--muted)}
@media (max-width:340px){.duty{grid-template-columns:auto minmax(0,1fr)}.duty-a{grid-column:1/-1}}

/* Next-duty card: the one loud element, styled like a duty vest with reflective tape */
.hero{background:var(--vis);color:var(--on-vis);border-radius:14px;padding:18px 18px 0;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.hero .eyebrow{margin:0;font:700 12px/1.2 var(--f-body);letter-spacing:.08em;text-transform:uppercase}
.hero-when{margin:8px 0 0;font:800 28px/1.08 var(--f-display);font-stretch:78%;text-wrap:balance}
.hero-what{margin:4px 0 0;font-size:16px}
.hero-stats{display:flex;flex-wrap:wrap;gap:4px 20px;margin:16px -18px 0;padding:10px 18px 12px;background:var(--vis-deep);border-top:3px solid var(--tape);font-size:13.5px;font-weight:700}

/* Setup checklist */
.onb{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.onb-h{padding:18px 18px 14px;display:flex;flex-direction:column;gap:8px}
.onb-h h2{margin:0;font:700 22px/1.15 var(--f-display);font-stretch:84%;text-wrap:balance}
.onb-h p{margin:0;color:var(--muted);max-width:60ch}
.meter{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:4px}
.meter span{display:block;height:100%;background:var(--accent);border-radius:4px}
.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:12px 18px;border-top:1px solid var(--line)}
.step-n{grid-row:1/span 2;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font:700 13px/1 var(--f-body);color:var(--muted)}
.step.done .step-n{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.step.next .step-n{border-color:var(--accent);color:var(--accent)}
.step-t{font-weight:700;grid-column:2}
.step.done .step-t{color:var(--muted)}
.step-d{font-size:13px;color:var(--muted);grid-column:2}
.step .btn{grid-column:3;grid-row:1/span 2}
@media (max-width:480px){.step .btn{grid-column:2;grid-row:auto;justify-self:start;margin-top:6px}}

/* Controls */
.btn{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:700 14px/1.1 var(--f-body);padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;min-height:34px}
.btn.armed{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.x{appearance:none;border:0;background:transparent;color:var(--muted);font-size:26px;line-height:1;width:40px;height:40px;border-radius:8px;cursor:pointer}
.pill{display:inline-flex;align-items:center;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.info{background:var(--info-bg);color:var(--info)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.muted{background:var(--sunk);color:var(--muted)}
.wk{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 6px;white-space:nowrap}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:13px;font-weight:700}
.hint{font-size:12.5px;color:var(--muted);margin:0}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-height:40px;max-width:100%;min-width:0}
input[type=time]{min-width:7.5em}
input[type=number]{width:6em}
textarea{resize:vertical;min-height:84px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.tog input{width:18px;height:18px;accent-color:var(--accent);flex:none}

/* Checks */
.checks{display:flex;flex-direction:column;gap:10px;background:var(--sunk);border-radius:8px;padding:10px 12px}
.chk-h{margin:0;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.checks ul{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;line-height:1.4}
.chk-i{flex:none;width:18px;height:18px;border-radius:50%;font:700 11px/18px var(--f-body);text-align:center;margin-top:1px}
.chk.ok .chk-i{background:var(--ok-bg);color:var(--ok)}
.chk.info .chk-i{background:var(--info-bg);color:var(--info)}
.chk.warn .chk-i{background:var(--warn-bg);color:var(--warn)}
.chk.bad .chk-i{background:var(--bad);color:var(--surface)}
.chk.bad{color:var(--bad);font-weight:700}

/* Swap cards */
.stack{display:flex;flex-direction:column;gap:10px}
.sc-h{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.sc-date{font:700 15px var(--f-display);font-stretch:92%}
.sc-h .pill{margin-left:auto}
.sc-t,.sc-d,.sc-n{margin:0}
.sc-d{color:var(--muted);font-size:14px}
.sc-n{font-style:italic;font-size:14px}
.acts{margin-top:2px}

/* Tables */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700;background:var(--sunk);white-space:nowrap}
tbody tr:last-child>*{border-bottom:0}
tbody th{font-weight:700;white-space:nowrap}
tbody th .sm{display:block;font-weight:400;color:var(--muted)}
td.na{background:repeating-linear-gradient(135deg,transparent 0 7px,var(--sunk) 7px 9px)}
.cell{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.cell.me{background:var(--vis);color:var(--on-vis);border-radius:5px;padding:2px 7px;font-weight:700;margin:-2px -7px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent);flex:none}
.cell.me .dot{background:var(--on-vis)}
.gap{color:var(--bad)}
.roster td select{min-height:34px;padding:3px 6px;font-size:14px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.over{color:var(--warn);font-weight:700}
td.under{color:var(--info);font-weight:700}
.edit td{white-space:nowrap}
.edit input[type=text]{width:11em}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:0}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:14px;height:14px;border-radius:3px;background:var(--vis);display:inline-block}

/* Roster week */
.wnav{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wlabel{display:flex;align-items:center;gap:8px;font:700 16px var(--f-display);font-stretch:90%}
.rtools{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.rday{display:flex;flex-direction:column;gap:8px}
.rday h3{font:700 16px var(--f-display);font-stretch:90%;margin:0}
.rday .none{margin:0;color:var(--muted)}

/* Lists */
.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.list li{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.list li:first-child{border-top:0}
.list li .btn{margin-left:auto}
.addblock{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.addblock .field input[type=text]{width:14em}

/* Setup */
.dchips{display:flex;gap:4px}
.dchip{position:relative;display:inline-block}
.dchip input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer;width:100%;height:100%}
.dchip span{display:inline-block;width:30px;height:30px;border-radius:6px;border:1px solid var(--line);text-align:center;font:700 12px/28px var(--f-body);color:var(--muted)}
.dchip input:checked+span{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dchip input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.ptogs{display:flex;flex-wrap:wrap;gap:6px 12px}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.errs{margin:0;padding-left:18px;color:var(--bad);font-size:14px;display:flex;flex-direction:column;gap:2px}
.savebar p{margin:0}

/* Rules box and footer */
details.rules{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
details.rules summary{cursor:pointer;font-weight:700}
details.rules ul{margin:10px 0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:68ch}
details.rules p{margin:0;font-size:13px}
.foot{padding-block:0 32px;color:var(--muted);font-size:12.5px}
.foot p{margin:0;max-width:70ch}

/* Dialog */
.dlg{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.dlg-back{position:absolute;inset:0;background:var(--scrim)}
.dlg-panel{position:relative;background:var(--surface);color:var(--ink);width:min(580px,100%);max-height:calc(100% - env(safe-area-inset-top,0px) - 20px);display:flex;flex-direction:column;border-radius:16px 16px 0 0;box-shadow:var(--shadow)}
.dlg-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.dlg-head h2{font:700 20px/1.2 var(--f-display);font-stretch:86%;margin:0}
.dlg-body{overflow-y:auto;padding:6px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.dlg-foot{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line)}
.dlg-duty{background:var(--sunk);border-radius:8px;padding:2px 12px 10px}
.dlg-duty p{margin:6px 0 0;font-size:13px}
.seg{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.seg legend{padding:0;margin-bottom:6px}
.seg-row{display:flex;flex-wrap:wrap;gap:8px}
.seg-o{position:relative;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:14px}
.seg-o.on{border-color:var(--accent);background:var(--accent-soft)}
.seg-o input{accent-color:var(--accent)}
@media (min-width:640px){.dlg{align-items:center}.dlg-panel{border-radius:16px;max-height:calc(100% - 48px)}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div class="shell">
  <header class="top" id="top">
    <div class="wrap topbar"><div class="brand"><span class="vest" aria-hidden="true"></span><div><h1 class="name">Playground Duty Swaps</h1></div></div></div>
  </header>
  <main class="wrap" id="view"><p class="loading">Loading the roster…</p></main>
  <footer class="wrap foot" id="foot"></footer>
</div>
<div id="dlg" class="dlg" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
/* ---------- constants ---------- */
const DAYS=["Mon","Tue","Wed","Thu","Fri"];
const DAY_LONG={Mon:"Monday",Tue:"Tuesday",Wed:"Wednesday",Thu:"Thursday",Fri:"Friday"};
const WD=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const WD_LONG=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const LS_ME="dutyswaps.me.v1", LS_HL="dutyswaps.hl.v1";
const FACTSHEET="https://education.nsw.gov.au/content/dam/main-education/industrial-relations/media/documents/school-day-factsheet/Attendance_and_Student_Supervision_Factsheet_-_January_2026.pdf";
const VIEWS={mine:"My duties",board:"Swaps",roster:"Roster",fair:"Fairness",setup:"Setup"};
const SUBS=["config","roster","teachers","avail","swaps","people"];
const KIND_LABEL={before:"Before school",break:"Recess or lunch",after:"After school"};
const ICON={ok:"✓",info:"i",warn:"!",bad:"×"};
const LEVEL_SR={ok:"OK: ",info:"Note: ",warn:"Warning: ",bad:"Not allowed: "};

/* ---------- small helpers ---------- */
const $=id=>document.getElementById(id);
function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{v?localStorage.setItem(k,v):localStorage.removeItem(k)}catch(e){}}
const clone=o=>o==null?null:JSON.parse(JSON.stringify(o));
const uidGen=p=>p+Math.random().toString(36).slice(2,9);
const nowISO=()=>new Date().toISOString();
const round1=x=>Math.round(x*10)/10;

function el(tag,props,...kids){
  const n=document.createElement(tag); let val;
  if(props) for(const k in props){
    const v=props[k];
    if(v==null||v===false) continue;
    if(k==="class") n.className=v;
    else if(k==="text") n.textContent=v;
    else if(k==="value") val=v;
    else if(k==="checked") n.checked=true;
    else if(k==="disabled") n.disabled=true;
    else if(k==="selected") n.selected=true;
    else if(k.slice(0,2)==="on") n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v===true?"":String(v));
  }
  addKids(n,kids);
  if(val!==undefined) n.value=val;
  return n;
}
function addKids(n,kids){for(const k of kids){if(k==null||k===false)continue;if(Array.isArray(k))addKids(n,k);else n.append(k instanceof Node?k:document.createTextNode(String(k)));}}

/* time and dates */
function toMin(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null}
function fmtT(min,suffix){const h=Math.floor(min/60),m=min%60;return ((h%12)||12)+":"+String(m).padStart(2,"0")+(suffix===false?"":(h>=12?"pm":"am"))}
function fmtRange(a,b){const A=toMin(a),B=toMin(b);if(A==null||B==null)return "";return fmtT(A,(A>=720)!==(B>=720))+"–"+fmtT(B)}
function len(a,b){const A=toMin(a),B=toMin(b);return A==null||B==null?0:Math.max(0,B-A)}
function overlap(a,b){return toMin(a.start)<toMin(b.end)&&toMin(b.start)<toMin(a.end)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function parse(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||"");return m?new Date(+m[1],+m[2]-1,+m[3]):null}
function today(){return iso(new Date())}
function addDays(s,n){const d=parse(s);d.setDate(d.getDate()+n);return iso(d)}
function dow(s){const d=parse(s);if(!d)return null;const i=d.getDay();return i>=1&&i<=5?DAYS[i-1]:null}
function fmtDate(s,long){const d=parse(s);if(!d)return s||"";return (long?WD_LONG:WD)[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]}
function mondayOf(s){const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)}
function dayDiff(a,b){return Math.round((parse(b)-parse(a))/86400000)}

/* ---------- state ---------- */
const S={db:null,uid:null,isOwner:false,canWrite:null,noDb:false,readOnly:false,
  ready:{},fresh:{},stale:false,dbError:"",
  config:null,roster:{},teachers:new Map(),avail:new Map(),swaps:[],people:new Map(),
  me:lsGet(LS_ME),view:"mine",weekOf:"",editRoster:false,hl:lsGet(LS_HL)!=="off",
  dialog:null,draft:null,draftDirty:false,staffText:"",confirm:"",pending:false,
  rosterDirty:false,rosterBusy:false,availDraft:null};

/* derived-data cache, cleared whenever data changes */
let cache=new Map();
function bump(){cache=new Map()}

function cfg(){
  const c=S.config||{};
  return {schoolName:c.schoolName||"",cycleWeeks:c.cycleWeeks===2?2:1,cycleStart:c.cycleStart||"",
    requireApproval:!!c.requireApproval,managers:Array.isArray(c.managers)?c.managers:[],
    days:c.days||{},breaks:Array.isArray(c.breaks)?c.breaks:[],periods:Array.isArray(c.periods)?c.periods:[],
    areas:Array.isArray(c.areas)?c.areas:[],noDuty:c.noDuty||""};
}
const onDay=(x,day)=>!x.days||!x.days.length||x.days.includes(day);
function hasSetup(){const c=cfg();return c.periods.length>0&&c.areas.length>0}
function isManager(){return !!S.db&&(S.isOwner||(!!S.uid&&cfg().managers.includes(S.uid)))}
function canAct(){return !!S.db&&!S.readOnly&&S.canWrite!==false}
function periodsOn(day){return cfg().periods.filter(p=>onDay(p,day)&&toMin(p.start)!=null&&toMin(p.end)!=null).sort((a,b)=>toMin(a.start)-toMin(b.start))}
function areasFor(p){return cfg().areas.filter(a=>!a.periods||!a.periods.length||a.periods.includes(p.id))}
function breaksOn(day){return cfg().breaks.filter(b=>onDay(b,day)&&toMin(b.start)!=null&&toMin(b.end)!=null)}
const cellKey=(w,day,pid,aid)=>w+"."+day+"."+pid+"."+aid;

function weekLetter(s){
  const c=cfg(); if(c.cycleWeeks!==2||!parse(c.cycleStart)) return "A";
  const w=Math.floor(dayDiff(mondayOf(c.cycleStart),mondayOf(s))/7);
  return ((w%2)+2)%2===0?"A":"B";
}
function noDutySet(){
  if(cache.has("__nd")) return cache.get("__nd");
  const set=new Set();
  for(const line of String(cfg().noDuty).split(/[\n,;]+/)){
    const m=line.match(/\d{4}-\d{2}-\d{2}/g); if(!m) continue;
    if(m.length===1){if(parse(m[0]))set.add(m[0]);continue;}
    let a=m[0],b=m[1]; if(!parse(a)||!parse(b)) continue; if(a>b)[a,b]=[b,a];
    for(let i=0;a<=b&&i<400;i++){set.add(a);a=addDays(a,1);}
  }
  cache.set("__nd",set); return set;
}
function isSchoolDay(s){return !!dow(s)&&!noDutySet().has(s)}
function nextSchoolDays(from,n){const out=[];let d=from;for(let i=0;i<120&&out.length<n;i++){if(isSchoolDay(d))out.push(d);d=addDays(d,1);}return out}

function sortedTeachers(){return [...S.teachers.entries()].sort((a,b)=>(a[1].name||"").localeCompare(b[1].name||""))}
function tname(id){if(!id)return "Nobody";const t=S.teachers.get(id);return t&&t.name?t.name:"A removed staff member"}
function who(id,cap){return id&&id===S.me?(cap?"You":"you"):tname(id)}
function poss(id){return id&&id===S.me?"your":tname(id)+"’s"}
function fteOf(t){const f=Number(t&&t.fte);return isFinite(f)&&f>=0&&f<=1?f:1}

/* ---------- roster engine ---------- */
/* Swaps that count: approved ones, plus agreed ones when approval isn't required. Applied in the order they were agreed. */
function applied(){
  if(cache.has("__ap")) return cache.get("__ap");
  const need=cfg().requireApproval;
  const list=S.swaps.filter(s=>s.status==="approved"||(!need&&s.status==="agreed"))
    .sort((a,b)=>(a.respondedAt||a.createdAt||"").localeCompare(b.respondedAt||b.createdAt||""));
  cache.set("__ap",list); return list;
}
/* Everyone's duties on one date, after swaps. */
function dayAssign(date){
  const ck="d:"+date; if(cache.has(ck)) return cache.get(ck);
  const out=[]; const day=dow(date);
  if(day&&isSchoolDay(date)){
    const w=weekLetter(date), ap=applied();
    for(const p of periodsOn(day)) for(const a of areasFor(p)){
      const k=cellKey(w,day,p.id,a.id); const base=S.roster[k]||null; let h=base,via=null;
      for(const s of ap){
        if(s.date===date&&s.cell===k&&s.from===h&&s.to){h=s.to;via=s;}
        else if(s.kind==="swap"&&s.backDate===date&&s.backCell===k&&s.to===h){h=s.from;via=s;}
      }
      out.push({date,key:k,period:p,area:a,base,holder:h,via,start:p.start,end:p.end});
    }
  }
  cache.set(ck,out); return out;
}
function slotOf(date,k){return dayAssign(date).find(x=>x.key===k)||null}
function holderOf(date,k){const s=slotOf(date,k);return s?s.holder:null}
function dutiesOf(tid,date){return tid?dayAssign(date).filter(a=>a.holder===tid):[]}
function upcoming(tid,n){const out=[];for(const d of nextSchoolDays(today(),n))for(const a of dutiesOf(tid,d))out.push(a);return out}
function availFor(tid,date){
  const d=S.avail.get(tid); const day=dow(date), w=weekLetter(date);
  return (d&&Array.isArray(d.blocks)?d.blocks:[]).filter(b=>b.day===day&&(!b.week||b.week==="*"||b.week===w)&&toMin(b.start)!=null&&toMin(b.end)>toMin(b.start));
}
/* Free time left inside recess and lunch after duties and marked commitments. */
function breakInfo(tid,date,duties){
  const wins=breaksOn(dow(date)); if(!wins.length) return null;
  const busy=duties.map(d=>[toMin(d.start),toMin(d.end)]).concat(availFor(tid,date).map(b=>[toMin(b.start),toMin(b.end)]));
  const free=[];
  for(const w of wins){
    let segs=[[toMin(w.start),toMin(w.end)]];
    for(const [bs,be] of busy){
      const next=[];
      for(const [s,e] of segs){
        if(be<=s||bs>=e){next.push([s,e]);continue;}
        if(bs>s) next.push([s,bs]);
        if(be<e) next.push([be,e]);
      }
      segs=next;
    }
    for(const [s,e] of segs) if(e-s>=5) free.push(e-s);
  }
  free.sort((a,b)=>b-a);
  const t1=free[0]||0,t2=free[1]||0,total=free.reduce((x,y)=>x+y,0);
  return {t1,t2,total,status:t1>=30?"ok":(t1+t2>=30?"split":"none")};
}
function baseStats(){
  if(cache.has("__base")) return cache.get("__base");
  const per=new Map(); let total=0,totalMin=0;
  const weeks=cfg().cycleWeeks===2?["A","B"]:["A"];
  for(const w of weeks) for(const day of DAYS) for(const p of periodsOn(day)) for(const a of areasFor(p)){
    const h=S.roster[cellKey(w,day,p.id,a.id)]; if(!h||!S.teachers.has(h)) continue;
    const m=len(p.start,p.end); total++; totalMin+=m;
    const r=per.get(h)||{count:0,min:0}; r.count++; r.min+=m; per.set(h,r);
  }
  let sumFte=0; for(const t of S.teachers.values()) sumFte+=fteOf(t);
  const res={per,total,totalMin,sumFte}; cache.set("__base",res); return res;
}
function cycleDates(date){
  const c=cfg(); let start=mondayOf(date);
  if(c.cycleWeeks===2&&weekLetter(date)==="B") start=addDays(start,-7);
  const out=[]; for(let i=0;i<(c.cycleWeeks===2?14:7);i++){const d=addDays(start,i);if(isSchoolDay(d))out.push(d);}
  return out;
}
function fairFor(tid,date,delta){
  const st=baseStats(); if(!st.total||!st.sumFte) return null;
  const f=fteOf(S.teachers.get(tid)); let count=delta;
  for(const d of cycleDates(date)) count+=dutiesOf(tid,d).length;
  return {count,f,target:st.total*f/st.sumFte,label:cfg().cycleWeeks===2?"that fortnight":"that week"};
}

/* The rule checks for one teacher on one date, if they gained addKeys and lost removeKeys. */
function checkDay(tid,date,addKeys,removeKeys){
  addKeys=addKeys||[]; removeKeys=removeKeys||[];
  const out=[]; const nm=tid===S.me?"You":tname(tid);
  if(date<today()) out.push(["bad","That date has already passed."]);
  if(!isSchoolDay(date)){out.push(["bad","No duties run on "+fmtDate(date,true)+"."]);return out;}
  const before=dutiesOf(tid,date);
  const ds=before.filter(d=>!removeKeys.includes(d.key));
  for(const k of addKeys){if(ds.some(d=>d.key===k))continue;const s=slotOf(date,k);if(s)ds.push(s);}
  ds.sort((a,b)=>toMin(a.start)-toMin(b.start));
  for(let i=0;i<ds.length;i++)for(let j=i+1;j<ds.length;j++)if(overlap(ds[i],ds[j]))
    out.push(["bad",`${nm} would be on two duties at once: ${ds[i].period.name} (${ds[i].area.name}) and ${ds[j].period.name} (${ds[j].area.name}).`]);
  const blocks=availFor(tid,date);
  for(const d of ds)for(const b of blocks)if(overlap(d,b))
    out.push(["warn",`${nm} marked ${fmtRange(b.start,b.end)} on ${DAY_LONG[dow(date)]} as a time they can't do duty${b.label?" ("+b.label+")":""}.`]);
  const bi=breakInfo(tid,date,ds);
  if(bi){
    if(bi.status==="ok") out.push(["ok",`${nm} still ${tid===S.me?"get":"gets"} a 30-minute break (${bi.t1} minutes free in one block).`]);
    else if(bi.status==="split") out.push(["info",`${tid===S.me?"Your":tname(tid)+"’s"} break would be split into ${bi.t1} + ${bi.t2} minutes. Two blocks are allowed when one 30-minute block isn't possible.`]);
    else out.push(["bad",`${nm} would be left without a 30-minute break: only ${bi.total} minutes free at recess and lunch.`]);
  }
  if(ds.length>=2) out.push(["warn",`That's ${ds.length} duties on ${DAY_LONG[dow(date)]} for ${tid===S.me?"you":tname(tid)}.`]);
  const fr=fairFor(tid,date,ds.length-before.length);
  if(fr){
    if(fr.f===0&&ds.length>before.length) out.push(["warn",`${nm} ${tid===S.me?"aren't":"isn't"} normally on the duty roster (duty share 0).`]);
    else if(fr.count>=fr.target+2) out.push(["warn",`${nm} would have ${fr.count} duties ${fr.label}, against a fair share of about ${round1(fr.target)}.`]);
  }
  if(date===today()) out.push(["info","This is a same-day change. Tell whoever runs daily organisation as well."]);
  return out;
}
function shortSlot(date,a){return `${fmtDate(date)} ${a.period.name} (${a.area.name})`}
/* Checks for every person a swap would give a duty to. */
function swapChecks(sw){
  const g=[]; if(!sw.to) return g;
  const hasBack=sw.kind==="swap"&&sw.backDate&&sw.backCell;
  const a=slotOf(sw.date,sw.cell);
  g.push({label:(sw.to===S.me?"For you":"For "+tname(sw.to))+(a?" · takes "+shortSlot(sw.date,a):""),
    items:checkDay(sw.to,sw.date,[sw.cell],hasBack&&sw.backDate===sw.date?[sw.backCell]:[])});
  if(hasBack){
    const b=slotOf(sw.backDate,sw.backCell);
    g.push({label:(sw.from===S.me?"For you":"For "+tname(sw.from))+(b?" · takes "+shortSlot(sw.backDate,b):""),
      items:checkDay(sw.from,sw.backDate,[sw.backCell],sw.backDate===sw.date?[sw.cell]:[])});
  }
  return g;
}
const isBlocked=g=>g.some(x=>x.items.some(i=>i[0]==="bad"));
function worst(items){return items.some(i=>i[0]==="bad")?"bad":items.some(i=>i[0]==="warn")?"warn":"ok"}

/* ---------- writes ---------- */
function errMsg(e){
  const c=e&&e.code;
  if(c==="quota_exceeded") return "Storage is full. A roster manager can clear old requests in Setup.";
  if(c==="resource_exhausted") return "Too many changes at once. Wait a moment and try again.";
  if(c==="unavailable") return "Couldn't reach the server. Check your connection and try again.";
  return "Couldn't save: "+((e&&e.message)||"unknown error");
}
async function write(fn,msg){
  if(!S.db){toast("Can't save here. Open this page on claude.ai while signed in.");return false;}
  if(S.readOnly||S.canWrite===false){toast("You can view this page but not change it.");return false;}
  try{await fn();if(msg)toast(msg);return true;}
  catch(e){
    let err=e;
    if(err&&err.code==="unavailable"){
      try{await new Promise(r=>setTimeout(r,500+Math.random()*700));await fn();if(msg)toast(msg);return true;}catch(e2){err=e2;}
    }
    if(err&&err.code==="invalid_argument"&&S.canWrite!==true){
      S.readOnly=true; doRender();
      toast("You can view this page but not change it. Ask the person who shared it for edit access.");
    } else {console.error(err);toast(errMsg(err));}
    return false;
  }
}
function setMe(id){
  S.me=id||""; lsSet(LS_ME,S.me);
  if(S.db&&S.uid&&id&&canAct()){try{S.db.doc("people/"+S.uid).set({teacherId:id,at:nowISO()}).catch(()=>{});}catch(e){}}
  bump(); doRender();
}
async function flushRoster(){
  if(S.rosterBusy) return; S.rosterBusy=true;
  try{while(S.rosterDirty){S.rosterDirty=false;const cells=Object.assign({},S.roster);
    const ok=await write(()=>S.db.doc("app/roster").set({cells,updatedAt:nowISO(),updatedBy:S.uid||null}));if(!ok)break;}}
  finally{S.rosterBusy=false;}
}
function setCell(k,v){
  const r=Object.assign({},S.roster); if(v) r[k]=v; else delete r[k];
  S.roster=r; S.rosterDirty=true; bump(); flushRoster(); doRender();
}
async function setStatus(s,status,msg){
  await write(()=>S.db.doc("swaps/"+s.id).update({status,respondedBy:S.uid||null,respondedAt:nowISO()}),msg);
}
async function acceptSwap(id,back){
  if(!S.me){toast("Choose your name at the top first.");return;}
  if(!S.db){toast("Can't save here.");return;}
  const ref=S.db.doc("swaps/"+id);
  try{const lease=await ref.acquire({holder:S.uid||("tab-"+Math.random().toString(36).slice(2)),ttlMs:8000});
    if(lease&&lease.acquired===false){toast("Someone else is taking this right now. Try again in a moment.");return;}}catch(e){}
  let cur=null;
  try{const snap=await ref.get();cur=snap.exists?snap.data():null;}catch(e){toast(errMsg(e));return;}
  if(!cur||cur.status!=="open"||(cur.to&&cur.to!==S.me)){toast("This request has already been taken or withdrawn.");return;}
  if(holderOf(cur.date,cur.cell)!==cur.from){toast(`${tname(cur.from)} no longer has that duty, so this can't go ahead.`);return;}
  const upd={status:"agreed",to:S.me,respondedBy:S.uid||null,respondedAt:nowISO()};
  if(cur.kind==="swap"){
    const bd=back?back.date:cur.backDate, bc=back?back.cell:cur.backCell;
    if(!bd||!bc){toast("Choose one of your duties to give back.");return;}
    if(holderOf(bd,bc)!==S.me){toast("You no longer have the duty you chose to give back.");return;}
    upd.backDate=bd; upd.backCell=bc;
  }
  const ok=await write(()=>ref.update(upd),cfg().requireApproval?"Accepted. It now needs a roster manager's approval.":"Done. The roster now shows the change.");
  if(ok&&S.dialog){S.dialog=null;doRender();}
}
async function approve(s){
  if(holderOf(s.date,s.cell)!==s.from){toast(`${tname(s.from)} no longer has that duty. Decline this one instead.`);return;}
  if(s.kind==="swap"&&s.backCell&&holderOf(s.backDate,s.backCell)!==s.to){toast(`${tname(s.to)} no longer has the duty they offered back.`);return;}
  await write(()=>S.db.doc("swaps/"+s.id).update({status:"approved",approvedBy:S.uid||null,approvedAt:nowISO()}),"Approved. The roster now shows the change.");
}
async function submitRequest(){
  const d=S.dialog; const a=slotOf(d.date,d.cell);
  if(!a||a.holder!==S.me){toast("You no longer have this duty.");return;}
  const parts=d.back?d.back.split("|"):["",""];
  const doc={kind:d.kind,date:d.date,cell:d.cell,from:S.me,to:d.to||null,
    backDate:d.kind==="swap"?parts[0]:"",backCell:d.kind==="swap"?parts[1]:"",
    note:(d.note||"").trim().slice(0,300),status:"open",createdBy:S.uid||null,createdAt:nowISO()};
  const ref=S.db.collection("swaps").doc();
  const ok=await write(()=>ref.set(doc),d.to?"Request sent to "+tname(d.to)+".":"Posted to the swap board.");
  if(ok){S.dialog=null;doRender();}
}
async function saveBlocks(tid,blocks,msg){
  await write(()=>S.db.doc("avail/"+tid).set({blocks,updatedAt:nowISO(),updatedBy:S.uid||null}),msg);
}

/* ---------- UI pieces ---------- */
let toastT;
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),4000)}
function banner(kind,text){return el("p",{class:"banner "+kind,text})}
function section(title,intro,...kids){return el("section",{class:"sec"},el("h2",{text:title}),intro?el("p",{class:"intro",text:intro}):null,kids)}
function emptyBox(title,text,action){return el("div",{class:"empty"},el("h2",{text:title}),el("p",{text}),action||null)}
function pill(kind,text){return el("span",{class:"pill "+kind,text})}
let confirmT;
function confirmBtn(k,label,armedLabel,fn,cls){
  const armed=S.confirm===k;
  return el("button",{class:(cls||"btn ghost sm")+(armed?" armed":""),type:"button",disabled:!canAct(),onclick:()=>{
    if(S.confirm===k){S.confirm="";fn();doRender();return;}

function checksView(groups,compact){
  if(!groups.length) return null;
  return el("div",{class:"checks"},groups.map(g=>{
    let items=g.items; if(compact){items=items.filter(i=>i[0]!=="ok");if(!items.length)items=[["ok","Fits the rules."]];}
    return el("div",null,el("p",{class:"chk-h",text:g.label}),el("ul",null,items.map(([lvl,txt])=>el("li",{class:"chk "+lvl},
      el("span",{class:"chk-i","aria-hidden":"true",text:ICON[lvl]}),el("span",null,el("span",{class:"sr",text:LEVEL_SR[lvl]}),txt)))));
  }));
}
function breakPill(bi){
  if(!bi) return null;
  if(bi.status==="ok") return pill("ok","Break OK");
  if(bi.status==="split") return pill("info",`Break ${bi.t1} + ${bi.t2} min`);
  return pill("bad","No 30-min break");
}
function dutyRow(a,opts){
  opts=opts||{};
  return el("div",{class:"duty"},
    el("span",{class:"time"+(opts.mine===false?"":" vis"),text:fmtRange(a.start,a.end)}),
    el("div",{class:"duty-main"},el("div",null,el("strong",{text:a.period.name})," · ",el("span",{text:a.area.name})),
      opts.sub?el("div",{class:"duty-s",text:opts.sub}):null),
    opts.action?el("div",{class:"duty-a"},opts.action):null);
}
function statusPill(s){
  const need=cfg().requireApproval;
  const map={open:s.to?["warn","Waiting for reply"]:["info","Open"],agreed:need?["warn","Waiting for approval"]:["ok","Done"],
    approved:["ok","Approved"],declined:["bad","Declined"],cancelled:["muted","Withdrawn"]};
  const m=map[s.status]||["muted",String(s.status||"")];
  return pill(m[0],m[1]);
}
function describe(s){
  const f=who(s.from,true), me=s.from===S.me;
  if(s.kind==="swap"){
    if(s.backDate&&s.backCell){const b=slotOf(s.backDate,s.backCell);
      return `${f} ${me?"swap":"swaps"} this for ${s.to?poss(s.to):"someone’s"} ${b?shortSlot(s.backDate,b):"duty"}.`;}
    return `${f} ${me?"want":"wants"} to swap this for one of ${s.to?poss(s.to):"your"} duties.`;
  }
  if(s.to) return `${f} ${me?"asked":"asks"} ${who(s.to)} to cover this.`;
  return `${f} ${me?"need":"needs"} someone to cover this.`;
}

function validate(d){
  const e=[];

    if(s==null||en==null) e.push(`Set school start and end times for ${DAY_LONG[day]}.`);
    else if(en<=s) e.push(`${DAY_LONG[day]}: school has to end after it starts.`);}
  for(const b of d.breaks){const s=toMin(b.start),en=toMin(b.end);
    if(!b.name) e.push("Give every break a name.");
    if(s==null||en==null||en<=s) e.push(`${b.name||"A break"}: set a start time and a later end time.`);}
  if(!d.breaks.length) e.push("Add recess and lunch so the page can check everyone's 30-minute break.");
  else for(const day of DAYS){const tot=d.breaks.filter(b=>onDay(b,day)).reduce((t,b)=>t+len(b.start,b.end),0);
    if(tot<30) e.push(`${DAY_LONG[day]}: recess and lunch add up to ${tot} minutes, so nobody could get a 30-minute break.`);}
  if(!d.periods.length) e.push("Add at least one duty time.");
  for(const p of d.periods){
    const nm=p.name||"A duty time"; const s=toMin(p.start),en=toMin(p.end);
    if(!p.name) e.push("Give every duty time a name.");

    for(const day of DAYS){
      if(!onDay(p,day)) continue; const x=d.days[day]||{}; const ds=toMin(x.start),de=toMin(x.end); let msg="";
      if(p.kind==="before"&&ds!=null){

        else if(en>ds) msg=`${nm} runs past the start of school on ${DAY_LONG[day]}.`;
      } else if(p.kind==="after"&&de!=null){

  for(const a of d.areas) if(!a.name) e.push("Give every duty area a name.");

    el("button",{class:"btn primary",type:"button",disabled:blocked||needBack||!canAct()||(d.kind==="swap"&&d.to&&!theirs.length),onclick:submitRequest},d.to?"Send request":"Post to swap board")]};
}
function dlgAccept(d){
  const s=S.swaps.find(x=>x.id===d.id); if(!s||s.status!=="open") return null;
  const a=slotOf(s.date,s.cell); if(!a) return null;
  const parts=d.back?d.back.split("|"):["",""];
  const groups=d.back?swapChecks(Object.assign({},s,{to:S.me,backDate:parts[0],backCell:parts[1]})):[{label:"For you",items:checkDay(S.me,s.date,[s.cell],[])}];
  const mine=upcoming(S.me,15);
  const body=[
    el("div",{class:"dlg-duty"},dutyRow(a,{mine:false}),el("p",{class:"muted",text:fmtDate(s.date,true)+" · from "+tname(s.from)})),
    s.note?el("p",{class:"sc-n",text:"“"+s.note+"”"}):null,
    el("label",{class:"field"},el("span",{class:"lbl"},"Which of your duties does "+tname(s.from)+" take?"),
      mine.length?el("select",{id:"acc-back",value:d.back,onchange:e=>{d.back=e.target.value;doRender();}},el("option",{value:""},"Choose one of your duties"),
        mine.map(x=>{const w=worst(checkDay(s.from,x.date,[x.key],x.date===s.date?[s.cell]:[]));
          return el("option",{value:x.date+"|"+x.key,text:shortSlot(x.date,x)+(w==="bad"?" — clashes for "+tname(s.from):"")});}))
      :el("p",{class:"muted",style:"margin:0"},"You have no duties in the next three weeks to swap.")),
    checksView(groups)];
  return {title:"Offer a swap",body,foot:[
    el("button",{class:"btn ghost",type:"button",onclick:closeDialog},"Cancel"),
    el("button",{class:"btn primary",type:"button",disabled:!d.back||isBlocked(groups)||!canAct(),onclick:()=>{const p=d.back.split("|");acceptSwap(s.id,{date:p[0],cell:p[1]});}},"Accept swap")]};
}
function renderDialog(){
  const root=$("dlg");
  const spec=S.dialog?(S.dialog.mode==="request"?dlgRequest(S.dialog):dlgAccept(S.dialog)):null;
  if(!spec){if(S.dialog)S.dialog=null;root.hidden=true;root.replaceChildren();document.documentElement.classList.remove("lock");return;}
  root.hidden=false; document.documentElement.classList.add("lock");
  root.replaceChildren(el("div",{class:"dlg-back",onclick:closeDialog}),
    el("div",{class:"dlg-panel",role:"dialog","aria-modal":"true","aria-labelledby":"dlg-title"},
      el("div",{class:"dlg-head"},el("h2",{id:"dlg-title",tabindex:"-1",text:spec.title}),el("button",{class:"x",type:"button","aria-label":"Close",onclick:closeDialog},"×")),
      el("div",{class:"dlg-body"},spec.body),el("div",{class:"dlg-foot"},spec.foot)));
}

/* ---------- header, footer, render loop ---------- */
function renderTop(){
  const c=cfg(), t=today();
  const forMe=S.me?S.swaps.filter(s=>s.status==="open"&&s.to===S.me&&s.date>=t).length:0;
  const open=S.swaps.filter(s=>s.status==="open"&&!s.to&&s.date>=t&&s.from!==S.me).length;
  const appr=isManager()&&c.requireApproval?S.swaps.filter(s=>s.status==="agreed"&&s.date>=t).length:0;
  const ts=sortedTeachers();
  $("top").replaceChildren(
    el("div",{class:"wrap topbar"},
      el("div",{class:"brand"},el("span",{class:"vest","aria-hidden":"true"}),el("div",null,el("h1",{class:"name"},"Playground Duty Swaps"),c.schoolName?el("p",{class:"school",text:c.schoolName}):null)),
      ts.length?el("label",{class:"who"},el("span",null,"I am"),el("select",{id:"who",value:S.me&&S.teachers.has(S.me)?S.me:"",onchange:e=>setMe(e.target.value)},
        el("option",{value:""},"Choose your name"),ts.map(([id,x])=>el("option",{value:id,text:x.name||"Unnamed"})))):null),
    el("nav",{class:"tabs","aria-label":"Sections"},el("div",{class:"wrap tabrow"},Object.keys(VIEWS).map(k=>{
      const b=k==="mine"?forMe:k==="board"?open+appr:0;
      return el("a",{href:"#"+k,class:"tab"+(S.view===k?" on":""),"aria-current":S.view===k?"page":null},VIEWS[k],b?el("span",{class:"badge",text:String(b),"aria-label":b+" waiting"}):null);
    }))));
}
function renderFoot(){
  $("foot").replaceChildren(el("p",null,"Made by staff, for staff. This isn't an official NSW Department of Education system: the principal's supervision plan is the official roster. Swaps are recorded with who made them."));
}
function banners(){
  const b=[];
  if(S.noDb) b.push(banner("bad","Shared data isn't available here. Open this page on claude.ai while signed in to see the roster."));
  else if(S.dbError) b.push(banner("bad","Saved data isn't available right now. Reload the page to try again."));
  else if(S.stale) b.push(banner("warn","Can't reach the saved roster yet. This page keeps trying, so what you see may be out of date."));
  if(S.readOnly||S.canWrite===false) b.push(banner("info","You can view the roster but can't make requests. Ask the person who shared this page to give you edit access."));
  return b;
}
function viewContent(){
  if(!S.noDb&&!SUBS.every(k=>S.ready[k])) return [el("p",{class:"loading"},"Loading the roster…")];
  switch(S.view){case "board":return viewBoard();case "roster":return viewRoster();case "fair":return viewFair();case "setup":return viewSetup();default:return viewMine();}
}
function doRender(){
  const ae=document.activeElement; const fid=ae&&ae!==document.body&&ae.id?ae.id:""; let sel=null;
  try{if(fid&&typeof ae.selectionStart==="number")sel=[ae.selectionStart,ae.selectionEnd];}catch(e){}
  S.pending=false;
  renderTop();
  let content; try{content=viewContent();}catch(err){console.error(err);content=[banner("bad","Something went wrong showing this page: "+((err&&err.message)||err))];}
  $("view").replaceChildren(...banners(),...[].concat(content).filter(Boolean));
  renderFoot(); renderDialog();
  if(S.dialog&&S.dialog.fresh){S.dialog.fresh=false;const t=$("dlg-title");if(t)t.focus({preventScroll:true});}
  else if(fid){const n=document.getElementById(fid);if(n&&n!==document.activeElement){try{n.focus({preventScroll:true});if(sel&&n.setSelectionRange)n.setSelectionRange(sel[0],sel[1]);}catch(e){}}}
}
function isTyping(){
  const a=document.activeElement; if(!a||a===document.body) return false;
  if(a.tagName==="TEXTAREA"||a.tagName==="SELECT") return true;
  return a.tagName==="INPUT"&&!/^(checkbox|radio|button|submit)$/.test(a.type);
}
/* Live updates wait while someone is typing, so their input isn't wiped. */
function render(){if(isTyping()){S.pending=true;return;}doRender()}
document.addEventListener("focusout",()=>setTimeout(()=>{if(S.pending&&!isTyping())doRender();},60));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.dialog)closeDialog();});
function readHash(){const h=location.hash.replace("#","");S.view=VIEWS[h]?h:"mine"}
window.addEventListener("hashchange",()=>{readHash();S.dialog=null;S.confirm="";doRender();window.scrollTo(0,0);});

/* ---------- data ---------- */
function subscribe(){
  const db=S.db;
  const done=(k,snap)=>{S.ready[k]=true;if(!snap.metadata||!snap.metadata.fromCache)S.fresh[k]=true;if(SUBS.every(x=>S.fresh[x]))S.stale=false;bump();render();};
  const fail=k=>e=>{S.ready[k]=true;S.dbError=(e&&e.code)||"unavailable";bump();render();};
  db.doc("app/config").onSnapshot(s=>{S.config=s.exists?s.data():null;if(!S.draftDirty)S.draft=null;done("config",s);},fail("config"));
  db.doc("app/roster").onSnapshot(s=>{if(!S.rosterBusy&&!S.rosterDirty){const d=s.exists?s.data():null;S.roster=d&&d.cells&&typeof d.cells==="object"?Object.assign({},d.cells):{};}done("roster",s);},fail("roster"));
  db.collection("teachers").onSnapshot(q=>{S.teachers=new Map(q.docs.map(d=>[d.id,d.data()||{}]));done("teachers",q);},fail("teachers"));
  db.collection("avail").onSnapshot(q=>{S.avail=new Map(q.docs.map(d=>[d.id,d.data()||{}]));done("avail",q);},fail("avail"));
  db.collection("swaps").onSnapshot(q=>{S.swaps=q.docs.map(d=>Object.assign({id:d.id},d.data()));done("swaps",q);},fail("swaps"));
  db.collection("people").onSnapshot(q=>{S.people=new Map(q.docs.map(d=>[d.id,d.data()||{}]));
    if(!S.me&&S.uid){const p=S.people.get(S.uid);if(p&&p.teacherId){S.me=p.teacherId;lsSet(LS_ME,S.me);}}done("people",q);},fail("people"));
  setTimeout(()=>{if(!SUBS.every(k=>S.fresh[k])&&!S.dbError){S.stale=true;doRender();}},10000);
}
async function init(){
  readHash(); doRender();
  const c=window.claude;
  if(!c||typeof c.use!=="function"){S.noDb=true;doRender();return;}
  let db=null,user=null;
  try{[db,user]=await Promise.all([c.use("db"),c.use("user")]);}catch(e){}
  if(user){
    try{const me=await user.me();S.uid=me.id||null;S.isOwner=!!me.isOwner;}catch(e){}
    try{S.canWrite=await user.can("data.write");}catch(e){S.canWrite=null;}
  }
  if(!db){S.noDb=true;doRender();return;}
  S.db=db; doRender(); subscribe();
}
init();
})();
</script>
